[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "piccompare-aec-agent"
version = "0.1.0"
description = "AEC measurement verification agent for precise floor-plan documents."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "numpy>=2.0,<3",
  "shapely>=2.0,<3",
  "opencv-python-headless>=4.10,<5",
  "ezdxf>=1.3,<2",
  "Pillow>=10.4,<12",
  "pydantic>=2.9,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
  "hypothesis>=6.112,<7",
  "ruff>=0.7,<1",
  "mypy>=1.11,<2",
]

[project.scripts]
aec = "aec.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }
packages = ["aec"]

[tool.pytest.ini_options]
pythonpath = ["src", ".", "scripts"]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "engine: requires the local PicCompare engine",
  "live: requires a live Meta API key and network",
  "slow: long-running or full-eval test",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/aec"]

[tool.coverage.run]
source = ["src/aec"]
omit = ["src/aec/cli.py"]

[tool.coverage.report]
fail_under = 85
