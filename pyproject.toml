[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "piccompare-aec-agent"
version = "0.1.0"
description = "Floor-plan revision checker for the architecture, engineering and construction industry."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "numpy>=2.0,<3",
  "shapely>=2.0,<3",
  "opencv-python-headless>=4.10,<5",
  "ezdxf>=1.3,<2",
  "Pillow>=10.4,<12",
  "pydantic>=2.9,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
  "hypothesis>=6.112,<7",
  "ruff>=0.7,<1",
  "mypy>=1.11,<2",
]
# Mask decoding only. Meta's parser carries the SAM License (not MIT), so it is
# an OPTIONAL extra and never a required runtime dependency of this MIT-licensed
# repository (MIT is a permissive open-source licence).
# Without it a SAM record still yields its box as a rectangle polygon.
live = [
  "meta-sam-parser>=0.1,<1",
]

[project.scripts]
aec = "aec.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }
packages = ["aec"]

[tool.pytest.ini_options]
pythonpath = ["src", ".", "scripts", "tests"]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "engine: requires the local PicCompare engine",
  "live: requires a live Meta API key and network",
  "slow: long-running or full-eval test",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/aec"]

[[tool.mypy.overrides]]
module = ["shapely.*", "cv2.*", "ezdxf.*"]
ignore_missing_imports = true

# The mask decoder is the optional `[live]` extra; CI installs only `[dev]`, so
# the stub has to be optional too or the Linux leg fails a type check it cannot
# satisfy without the SAM-licensed package.
[[tool.mypy.overrides]]
module = ["meta_sam_parser.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["src/aec"]
omit = ["src/aec/cli.py"]

[tool.coverage.report]
fail_under = 85
